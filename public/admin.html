<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问鼎国际娱乐 · 玩家信息后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1728;color:#eaf0f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.card{background:#17243b;border:1px solid #304363;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0005}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.title{font-size:22px;font-weight:900;color:#fbbf24}.sub{font-size:12px;color:#8ba0c0;margin-top:4px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.input{height:42px;min-width:260px;flex:1;background:#0f1b2d;border:1px solid #344866;border-radius:10px;padding:0 12px;color:#fff;outline:0}.btn{height:42px;padding:0 18px;border:0;border-radius:10px;background:#fbbf24;color:#201503;font-weight:900;cursor:pointer}.muted{color:#8ba0c0;font-size:12px}.table-wrap{overflow:auto;border:1px solid #2d405f;border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:1180px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #273a59;text-align:left;vertical-align:top;font-size:12px}.table th{background:#1d2d49;color:#fbbf24;position:sticky;top:0}.device{line-height:1.6;color:#b8c7dc}.err{color:#fca5a5;margin:8px 0}.ok{color:#6ee7b7}
</style></head><body><div class="wrap"><div class="head"><div><div class="title">问鼎国际娱乐 · 玩家信息后台</div><div class="sub">注册 / 登录 IP、设备与登录记录</div></div></div><div class="card"><div class="bar"><input id="token" class="input" type="password" placeholder="请输入后台 ADMIN_TOKEN"><button id="load" class="btn">读取玩家</button></div><div id="msg" class="muted">后台令牌不会写入网页文件。</div><div id="table"></div></div></div>
<script>
const tokenEl=document.getElementById('token'),load=document.getElementById('load'),msg=document.getElementById('msg'),table=document.getElementById('table');
tokenEl.value=sessionStorage.getItem('wd_admin_token')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function fmt(v){try{return new Date(v).toLocaleString('zh-CN',{hour12:false});}catch(e){return v||''}}
function dev(x){if(!x)return '';return '<div class="device">IP：'+esc(x.ip)+'<br>地区：'+esc([x.countryName,x.city,x.subdivision].filter(Boolean).join(' / '))+'<br>平台：'+esc(x.platform)+'<br>语言：'+esc(x.language)+'<br>时区：'+esc(x.timezone)+'<br>屏幕：'+esc(x.screenWidth)+'×'+esc(x.screenHeight)+'<br>视口：'+esc(x.viewportWidth)+'×'+esc(x.viewportHeight)+'<br>CPU：'+esc(x.hardwareConcurrency||'未知')+' 核 · 内存：'+esc(x.deviceMemory||'未知')+' GB<br>触控：'+esc(x.maxTouchPoints||0)+' 点<br>UA：'+esc(x.userAgent)+'</div>'}
async function loadUsers(){const t=tokenEl.value.trim();if(!t){msg.textContent='请输入 ADMIN_TOKEN';return}sessionStorage.setItem('wd_admin_token',t);msg.textContent='读取中…';table.innerHTML='';try{const r=await fetch('/api/admin/users',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'读取失败');msg.innerHTML='<span class="ok">共 '+esc(d.total)+' 个玩家</span>';let h='<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>注册时间</th><th>注册信息</th><th>最近登录</th><th>最近登录设备</th></tr></thead><tbody>';for(const u of d.users){h+='<tr><td><b>'+esc(u.account)+'</b><br><span class="muted">'+esc(u.id)+'</span></td><td>'+esc(fmt(u.createdAt))+'</td><td>'+dev(u.registration)+'</td><td>'+esc(fmt(u.lastLoginAt))+'</td><td>'+dev(u.lastLogin)+'</td></tr>'}h+='</tbody></table></div>';table.innerHTML=h}catch(e){msg.innerHTML='<span class="err">'+esc(e.message||'读取失败')+'</span>'}}
load.onclick=loadUsers;tokenEl.addEventListener('keydown',e=>{if(e.key==='Enter')loadUsers()});
</script></body></html>
